# YOLO Uncertainty Calibration Configuration

## Baseline Configuration (Deterministic Inference Only)

baseline:
  model: yolov8n
  pretrained: true
  device: auto  # auto-detect GPU or use CPU
  imgsz: 640
  conf_threshold: 0.25
  iou_threshold: 0.45

inference:
  batch_size: 1
  device: auto
  half: false  # Set to true for FP16 if GPU available

output:
  save_results: true
  output_dir: results/
  visualize: true
  anno_dir: results/annotated_images/

# Head-level MC Dropout Configuration
dropout:
  enabled: true
  probability: 0.1

mc_inference:
  enabled: true
  passes: 5
  batch_size: 5

# Phase 6 uncertainty metrics
uncertainty:
  entropy:
    enabled: true
    normalized: true
  localization:
    enabled: true
    method: mean_coordinate_variance
  persistence:
    enabled: true

# Greedy IoU association of MC-dropout detections
clustering:
  method: greedy_iou
  iou_threshold: 0.5

# Provisional Phase 8 uncertainty-gate thresholds. Select these from validation
# data in a later phase; no threshold optimization is performed here.
filtering:
  enabled: true
  entropy:
    enabled: true
    max_normalized_entropy: 0.1
  localization:
    enabled: true
    max_variance: 500.0
  persistence:
    enabled: true
    min_persistence: 0.8

# Evaluation (will be used in later phases)
